<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171923">
<title>Kanji Man</title>
<style>
:root {
  --bg:#10121b; --panel:#1b1e2b; --panel2:#242838;
  --text:#f5f5fa; --muted:#a3a8bb; --accent:#f5c451;
  --red:#e45d65; --orange:#e99b45; --green:#55bd83;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button { font:inherit; cursor:pointer; }
header {
  padding:22px 20px 16px; text-align:center;
  border-bottom:1px solid #303446;
}
.logo { font-size:30px; font-weight:900; letter-spacing:1px; }
.logo span { color:var(--accent); }
.tagline { color:var(--muted); font-size:12px; margin-top:3px; }
nav {
  display:flex; justify-content:center; gap:8px; padding:14px 8px;
  position:sticky; top:0; background:var(--bg); z-index:5;
  border-bottom:1px solid #303446;
}
nav button {
  border:0; background:transparent; color:var(--muted);
  padding:9px 12px; border-radius:10px; font-size:13px;
}
nav button.active { background:var(--panel2); color:var(--accent); }
main { max-width:720px; margin:auto; padding:22px 16px 50px; }
h1 { font-size:23px; margin:0 0 6px; }
.subtitle { color:var(--muted); margin:0 0 22px; font-size:14px; }
.stats {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  margin-bottom:20px;
}
.stat {
  background:var(--panel); border-radius:14px; padding:14px 8px;
  text-align:center;
}
.stat strong { display:block; font-size:23px; color:var(--accent); }
.stat span { font-size:11px; color:var(--muted); }
.card {
  background:var(--panel); border:1px solid #303446;
  border-radius:20px; padding:26px 18px; text-align:center;
  min-height:290px; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
}
.deck-label {
  color:var(--accent); font-size:12px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase;
}
.kanji { font-size:100px; line-height:1.3; margin:12px 0; }
.prompt { color:var(--muted); font-size:14px; }
.answer { width:100%; border-top:1px solid #383d50; margin-top:20px; padding-top:17px; }
.answer h2 { margin:0 0 8px; font-size:23px; }
.answer p { margin:6px 0; color:#d8dbea; font-size:14px; }
.answer .example { color:var(--muted); font-size:13px; margin-top:14px; }
.hidden { display:none !important; }
.primary {
  background:var(--accent); color:#171923; border:0;
  border-radius:12px; padding:14px 20px; font-weight:800;
  width:100%; margin-top:16px;
}
.ratings { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:16px; }
.ratings button {
  border:0; border-radius:12px; padding:14px 4px;
  color:#10121b; font-weight:800; font-size:14px;
}
.again { background:var(--red); }
.hard { background:var(--orange); }
.good { background:var(--green); }
.empty {
  background:var(--panel); border-radius:18px; padding:35px 20px;
  text-align:center; color:var(--muted);
}
.list { display:grid; gap:9px; }
.kanji-row {
  display:flex; align-items:center; gap:14px;
  background:var(--panel); padding:13px 16px; border-radius:13px;
}
.kanji-row .symbol { font-size:35px; width:48px; text-align:center; }
.kanji-row strong { display:block; }
.kanji-row small { color:var(--muted); }
.progressbar { height:9px; background:#303446; border-radius:9px; overflow:hidden; margin:9px 0 20px; }
.progressbar div { height:100%; background:var(--green); width:0%; }
.setting {
  background:var(--panel); padding:16px; border-radius:14px;
  margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;
}
.setting input {
  width:65px; background:var(--panel2); color:var(--text);
  border:1px solid #41465a; border-radius:8px; padding:8px;
}
.note { color:var(--muted); font-size:12px; line-height:1.6; }
footer { text-align:center; color:#72788d; font-size:11px; padding:20px; }
@media(max-width:420px) {
  nav { gap:0; }
  nav button { padding:9px 8px; font-size:12px; }
  .kanji { font-size:86px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">漢字<span>マン</span></div>
  <div class="tagline">Your daily battle against kanji.</div>
</header>

<nav>
  <button class="active" data-page="study">Study</button>
  <button data-page="library">Library</button>
  <button data-page="progress">Progress</button>
  <button data-page="settings">Settings</button>
</nav>

<main id="app"></main>
<footer>KANJI MAN · Personal study edition</footer>

<script>
const sampleKanji = [
  {id:1,k:"政",meaning:"politics; government",on:"セイ・ショウ",kun:"まつりごと",words:[["政治","せいじ","politics"],["政府","せいふ","government"]],example:"政治について勉強しています。",translation:"I am studying politics."},
  {id:2,k:"議",meaning:"deliberation; discussion",on:"ギ",kun:"-",words:[["会議","かいぎ","meeting"],["議論","ぎろん","discussion"]],example:"午後、会議があります。",translation:"I have a meeting this afternoon."},
  {id:3,k:"民",meaning:"people; citizens",on:"ミン",kun:"たみ",words:[["国民","こくみん","citizens"],["市民","しみん","citizens; residents"]],example:"国民の意見を聞きます。",translation:"We listen to the people's opinions."},
  {id:4,k:"連",meaning:"connect; take along",on:"レン",kun:"つ(れる)",words:[["連絡","れんらく","contact"],["連続","れんぞく","continuation"]],example:"あとで連絡します。",translation:"I'll contact you later."},
  {id:5,k:"対",meaning:"opposite; versus",on:"タイ・ツイ",kun:"-",words:[["反対","はんたい","opposition"],["対象","たいしょう","target; object"]],example:"私はその意見に反対です。",translation:"I disagree with that opinion."},
  {id:6,k:"部",meaning:"section; department; part",on:"ブ",kun:"-",words:[["部分","ぶぶん","part"],["部長","ぶちょう","department manager"]],example:"この部分を読んでください。",translation:"Please read this part."},
  {id:7,k:"合",meaning:"fit; join; combine",on:"ゴウ・ガッ・カッ",kun:"あ(う)・あ(わせる)",words:[["場合","ばあい","case; situation"],["合格","ごうかく","passing an exam"]],example:"試験に合格しました。",translation:"I passed the exam."},
  {id:8,k:"市",meaning:"city; market",on:"シ",kun:"いち",words:[["市役所","しやくしょ","city hall"],["市場","いちば","market"]],example:"市役所へ行きます。",translation:"I'm going to city hall."},
  {id:9,k:"内",meaning:"inside; within",on:"ナイ・ダイ",kun:"うち",words:[["国内","こくない","domestic; within the country"],["内容","ないよう","contents"]],example:"箱の内側を見てください。",translation:"Please look inside the box."},
  {id:10,k:"相",meaning:"mutual; together; minister",on:"ソウ・ショウ",kun:"あい",words:[["相談","そうだん","consultation"],["相手","あいて","partner; other person"]],example:"友達に相談しました。",translation:"I consulted my friend."},
  {id:11,k:"定",meaning:"determine; fixed",on:"テイ・ジョウ",kun:"さだ(める)・さだ(まる)",words:[["予定","よてい","plan; schedule"],["決定","けってい","decision"]],example:"明日の予定を決めます。",translation:"I'll decide tomorrow's plans."},
  {id:12,k:"回",meaning:"times; revolve; turn",on:"カイ・エ",kun:"まわ(る)・まわ(す)",words:[["今回","こんかい","this time"],["毎回","まいかい","every time"]],example:"日本へ三回行きました。",translation:"I've been to Japan three times."}
];

const STORAGE_KEY = "kanjiMan_v1";
const defaultState = {
  dailyNew:20,
  cards:{},
  history:[],
  activeDeck:"N3"
};
let state = loadState();
let page = "study";
let currentCard = null;
let revealed = false;
let sessionQueue = [];
let sessionCount = 0;

function loadState() {
  try {
    return {...defaultState,...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")};
  } catch(e) { return {...defaultState}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function cardState(id) {
  return state.cards[id] || {reps:0,interval:0,due:0,seen:false};
}
function dueCards() {
  const now = Date.now();
  return sampleKanji.filter(k => {
    const s = cardState(k.id);
    return s.seen && s.due <= now;
  });
}
function newCards() {
  return sampleKanji.filter(k => !cardState(k.id).seen).slice(0,state.dailyNew);
}
function makeQueue() {
  const due = dueCards();
  const fresh = newCards();
  sessionQueue = [...due,...fresh];
  sessionCount = 0;
}
function startCard() {
  if (!sessionQueue.length) makeQueue();
  currentCard = sessionQueue.shift() || null;
  revealed = false;
  render();
}
function rateCard(rating) {
  if (!currentCard) return;
  const id = currentCard.id;
  const s = cardState(id);
  const now = Date.now();

  if (rating === "again") {
    s.interval = 0;
    s.due = now + 10 * 60 * 1000;
    sessionQueue.push(currentCard);
  } else if (rating === "hard") {
    s.interval = s.seen ? Math.max(1,Math.ceil(s.interval * 1.2)) : 1;
    s.due = now + s.interval * 86400000;
    s.reps += 1;
    s.seen = true;
  } else {
    s.interval = s.seen ? Math.max(4,Math.ceil(s.interval * 2.2)) : 4;
    s.due = now + s.interval * 86400000;
    s.reps += 1;
    s.seen = true;
  }

  state.cards[id] = s;
  state.history.push({id,rating,date:now});
  saveState();
  sessionCount++;
  startCard();
}
function showStudy() {
  const due = dueCards().length;
  const fresh = newCards().length;
  const total = due + fresh;
  const app = document.getElementById("app");

  if (!currentCard && !sessionQueue.length) makeQueue();
  if (!currentCard) currentCard = sessionQueue.shift() || null;

  app.innerHTML = `
    <h1>Today's training</h1>
    <p class="subtitle">Your N3 training ground. One kanji at a time.</p>
    <div class="stats">
      <div class="stat"><strong>${due}</strong><span>Reviews due</span></div>
      <div class="stat"><strong>${fresh}</strong><span>New kanji</span></div>
      <div class="stat"><strong>${sessionCount}</strong><span>Reviewed today</span></div>
    </div>
    ${currentCard ? `
      <section class="card">
        <div class="deck-label">JLPT ${state.activeDeck} · Kanji</div>
        <div class="kanji">${currentCard.k}</div>
        <div class="prompt">What does this kanji mean? What are its readings?</div>
        <div class="answer ${revealed ? "" : "hidden"}">
          <h2>${currentCard.meaning}</h2>
          <p><strong>On'yomi:</strong> ${currentCard.on}</p>
          <p><strong>Kun'yomi:</strong> ${currentCard.kun}</p>
          <p style="margin-top:15px"><strong>Common words</strong></p>
          ${currentCard.words.map(w=>`<p>${w[0]} · ${w[1]} · ${w[2]}</p>`).join("")}
          <p class="example">${currentCard.example}<br>${currentCard.translation}</p>
        </div>
      </section>
      ${!revealed ? `<button class="primary" id="reveal">Reveal answer</button>` : `
        <div class="ratings">
          <button class="again" data-rating="again">Again</button>
          <button class="hard" data-rating="hard">Hard</button>
          <button class="good" data-rating="good">Good</button>
        </div>
        <p class="note" style="text-align:center">Again: repeat soon · Hard: 1 day · Good: 4 days initially</p>
      `}
    ` : `
      <div class="empty">
        <div style="font-size:48px">🎉</div>
        <h2>Training complete!</h2>
        <p>You've finished all the cards currently due. Nice work.</p>
        <p class="note">Come back when your next reviews are due, or add more kanji as we expand the library.</p>
      </div>
    `}
  `;

  document.getElementById("reveal")?.addEventListener("click",()=>{
    revealed = true; render();
  });
  document.querySelectorAll("[data-rating]").forEach(btn=>{
    btn.addEventListener("click",()=>rateCard(btn.dataset.rating));
  });
}
function showLibrary() {
  document.getElementById("app").innerHTML = `
    <h1>Kanji Library</h1>
    <p class="subtitle">Your collection of kanji. Currently showing sample N3 cards.</p>
    <div class="list">
      ${sampleKanji.map(k=>`
        <div class="kanji-row">
          <div class="symbol">${k.k}</div>
          <div><strong>${k.meaning}</strong><small>On: ${k.on} · Kun: ${k.kun}</small></div>
        </div>
      `).join("")}
    </div>
  `;
}
function showProgress() {
  const learned = sampleKanji.filter(k=>cardState(k.id).seen).length;
  const total = sampleKanji.length;
  const percent = Math.round(learned/total*100);
  const reviews = state.history.length;
  const good = state.history.filter(h=>h.rating==="good").length;
  const hard = state.history.filter(h=>h.rating==="hard").length;
  const again = state.history.filter(h=>h.rating==="again").length;

  document.getElementById("app").innerHTML = `
    <h1>Your progress</h1>
    <p class="subtitle">Every review is a step forward.</p>
    <div class="stats">
      <div class="stat"><strong>${learned}</strong><span>Learned</span></div>
      <div class="stat"><strong>${reviews}</strong><span>Total reviews</span></div>
      <div class="stat"><strong>${percent}%</strong><span>Sample completed</span></div>
    </div>
    <p><strong>Sample deck progress</strong></p>
    <div class="progressbar"><div style="width:${percent}%"></div></div>
    <div class="stats">
      <div class="stat"><strong>${good}</strong><span>Good</span></div>
      <div class="stat"><strong>${hard}</strong><span>Hard</span></div>
      <div class="stat"><strong>${again}</strong><span>Again</span></div>
    </div>
    <p class="note">Your progress is saved in this browser on this device. We'll add a proper backup and restore feature before the full release.</p>
  `;
}
function showSettings() {
  document.getElementById("app").innerHTML = `
    <h1>Settings</h1>
    <p class="subtitle">Set up your daily training.</p>
    <div class="setting">
      <div><strong>New kanji per day</strong><div class="note">Your daily learning target</div></div>
      <input id="dailyNew" type="number" min="1" max="100" value="${state.dailyNew}">
    </div>
    <div class="setting">
      <div><strong>Active deck</strong><div class="note">Currently training with JLPT N3</div></div>
      <strong style="color:var(--accent)">N3</strong>
    </div>
    <p class="note">The full app will support separate N5, N4, N3, N2 and N1 decks, with the ability to combine levels.</p>
    <button class="primary" id="saveSettings">Save settings</button>
    <button class="primary" id="reset" style="background:#383d50;color:white;margin-top:10px">Reset sample progress</button>
  `;
  document.getElementById("saveSettings").addEventListener("click",()=>{
    const value = Number(document.getElementById("dailyNew").value);
    if (value >= 1 && value <= 100) {
      state.dailyNew = value;
      saveState();
      makeQueue();
      currentCard = null;
      alert("Settings saved!");
      render();
    } else alert("Please enter a number between 1 and 100.");
  });
  document.getElementById("reset").addEventListener("click",()=>{
    if (confirm("Reset all sample study progress?")) {
      state.cards = {};
      state.history = [];
      saveState();
      sessionQueue = [];
      currentCard = null;
      sessionCount = 0;
      render();
    }
  });
}
function render() {
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });
  if (page==="study") showStudy();
  if (page==="library") showLibrary();
  if (page==="progress") showProgress();
  if (page==="settings") showSettings();
}
document.querySelectorAll("nav button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    page = btn.dataset.page;
    if (page==="study" && !currentCard) makeQueue();
    render();
  });
});
makeQueue();
currentCard = sessionQueue.shift() || null;
render();
</script>
</body>
</html>
