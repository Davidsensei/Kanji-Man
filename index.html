<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171923">
<title>Kanji Man</title>
<style>
:root {
  --bg:#10121b; --panel:#1b1e2b; --panel2:#242838;
  --text:#f5f5fa; --muted:#a3a8bb; --accent:#f5c451;
  --red:#e45d65; --orange:#e99b45; --green:#55bd83;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button { font:inherit; cursor:pointer; }
header {
  padding:22px 20px 16px; text-align:center;
  border-bottom:1px solid #303446;
}
.logo { font-size:30px; font-weight:900; letter-spacing:1px; }
.logo span { color:var(--accent); }
.tagline { color:var(--muted); font-size:12px; margin-top:3px; }
nav {
  display:flex; justify-content:center; gap:8px; padding:14px 8px;
  position:sticky; top:0; background:var(--bg); z-index:5;
  border-bottom:1px solid #303446;
}
nav button {
  border:0; background:transparent; color:var(--muted);
  padding:9px 12px; border-radius:10px; font-size:13px;
}
nav button.active { background:var(--panel2); color:var(--accent); }
main { max-width:720px; margin:auto; padding:22px 16px 50px; }
h1 { font-size:23px; margin:0 0 6px; }
.subtitle { color:var(--muted); margin:0 0 22px; font-size:14px; }
.stats {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  margin-bottom:20px;
}
.stat {
  background:var(--panel); border-radius:14px; padding:14px 8px;
  text-align:center;
}
.stat strong { display:block; font-size:23px; color:var(--accent); }
.stat span { font-size:11px; color:var(--muted); }
.card {
  background:var(--panel); border:1px solid #303446;
  border-radius:20px; padding:26px 18px; text-align:center;
  min-height:290px; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
}
.deck-label {
  color:var(--accent); font-size:12px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase;
}
.kanji { font-size:100px; line-height:1.3; margin:12px 0; }
.prompt { color:var(--muted); font-size:14px; }
.answer { width:100%; border-top:1px solid #383d50; margin-top:20px; padding-top:17px; }
.answer h2 { margin:0 0 8px; font-size:23px; }
.answer p { margin:6px 0; color:#d8dbea; font-size:14px; }
.answer .example { color:var(--muted); font-size:13px; margin-top:14px; }
.hidden { display:none !important; }
.primary {
  background:var(--accent); color:#171923; border:0;
  border-radius:12px; padding:14px 20px; font-weight:800;
  width:100%; margin-top:16px;
}
.ratings { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:16px; }
.ratings button {
  border:0; border-radius:12px; padding:14px 4px;
  color:#10121b; font-weight:800; font-size:14px;
}
.again { background:var(--red); }
.hard { background:var(--orange); }
.good { background:var(--green); }
.empty {
  background:var(--panel); border-radius:18px; padding:35px 20px;
  text-align:center; color:var(--muted);
}
.list { display:grid; gap:9px; }
.kanji-row {
  display:flex; align-items:center; gap:14px;
  background:var(--panel); padding:13px 16px; border-radius:13px;
}
.kanji-row .symbol { font-size:35px; width:48px; text-align:center; }
.kanji-row strong { display:block; }
.kanji-row small { color:var(--muted); }
.progressbar { height:9px; background:#303446; border-radius:9px; overflow:hidden; margin:9px 0 20px; }
.progressbar div { height:100%; background:var(--green); width:0%; }
.setting {
  background:var(--panel); padding:16px; border-radius:14px;
  margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;
}
.setting input {
  width:65px; background:var(--panel2); color:var(--text);
  border:1px solid #41465a; border-radius:8px; padding:8px;
}
.note { color:var(--muted); font-size:12px; line-height:1.6; }
footer { text-align:center; color:#72788d; font-size:11px; padding:20px; }
@media(max-width:420px) {
  nav { gap:0; }
  nav button { padding:9px 8px; font-size:12px; }
  .kanji { font-size:86px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">漢字<span>マン</span></div>
  <div class="tagline">Your daily battle against kanji.</div>
</header>

<nav>
  <button class="active" data-page="study">Study</button>
  <button data-page="library">Library</button>
  <button data-page="progress">Progress</button>
  <button data-page="settings">Settings</button>
</nav>

<main id="app"></main>
<footer>KANJI MAN · Personal study edition</footer>

<script>
const STORAGE_KEY = "kanjiMan_v1";

const defaultState = {
  dailyNew: 20,
  dailyNewCountByDeck: {},
  cards: {},
  history: [],
  activeDeck: "N3",
  showFurigana: true
};

let state = loadState();
let page = "study";
let kanjiData = [];
let vocabData = [];
let currentCard = null;
let revealed = false;
let sessionQueue = [];
let sessionCount = 0;
let dataReady = false;
let dataError = "";

function todayKey() {
  const now = new Date();
  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
}

function getDailyNewCount() {
  const deck = state.activeDeck;
  const daily = state.dailyNewCountByDeck || {};

  if (!daily[deck] || daily[deck].date !== todayKey()) {
    return 0;
  }

  return daily[deck].count || 0;
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    return {
      ...defaultState,
      ...saved,
      cards: saved.cards || {},
      history: saved.history || [],
      dailyNewCountByDeck: saved.dailyNewCountByDeck || {}
    };

  } catch (e) {
    return {
      ...defaultState,
      dailyNewCountByDeck: {}
    };
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// Converts {漢字|かんじ} into proper ruby furigana.
// When furigana is switched off, only the kanji remains.
function formatFurigana(sentence) {
  const text = String(sentence || "");

  return text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, (match, kanji, reading) => {
    if (!state.showFurigana) return escapeHTML(kanji);

    return `<ruby>${escapeHTML(kanji)}<rt>${escapeHTML(reading)}</rt></ruby>`;
  }).replace(/\n/g, "<br>");
}

function cardState(character) {
  const key = `${state.activeDeck}_${character}`;

  // Keep existing N3 progress when upgrading to deck-specific keys
  if (
    state.activeDeck === "N3" &&
    state.cards[character] &&
    !state.cards[key]
  ) {
    state.cards[key] = state.cards[character];
    delete state.cards[character];
  }

  return state.cards[key] || {
    reps: 0,
    interval: 0,
    due: 0,
    seen: false
  };
}

function getWordsForKanji(kanji) {
  const wordList = new Set(kanji.words || []);

  return vocabData.filter(item => wordList.has(item.word));
}

async function loadDatabase() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="empty">
      <h2>Loading your ${state.activeDeck} database...</h2>
      <p>Please wait a moment.</p>
    </div>
  `;

  try {
    const [kanjiResponse, vocabResponse] = await Promise.all([
      fetch(`./data/kanji/${state.activeDeck.toLowerCase()}.json`),
      fetch(`./data/vocab/${state.activeDeck.toLowerCase()}.json`)
    ]);

    if (!kanjiResponse.ok) {
      throw new Error(`Could not load the ${state.activeDeck} kanji file.`);
    }

    if (!vocabResponse.ok) {
      throw new Error(`Could not load the ${state.activeDeck} vocabulary file.`);
    }

    kanjiData = await kanjiResponse.json();
    vocabData = await vocabResponse.json();

    if (!Array.isArray(kanjiData) || !Array.isArray(vocabData)) {
      throw new Error("The database files do not have the expected format.");
    }

    dataReady = true;
    makeQueue();
    currentCard = sessionQueue.shift() || null;
    render();

  } catch (error) {
    console.error("Kanji Man database error:", error);
    dataError = error.message;

    app.innerHTML = `
      <div class="empty">
        <h2>Database loading problem</h2>
        <p>${escapeHTML(dataError)}</p>
        <p class="note">
          Please check that the files are in
          data/kanji/${state.activeDeck.toLowerCase()}.json and data/vocab/${state.activeDeck.toLowerCase()}.json.
        </p>
        <button class="primary" onclick="loadDatabase()">Try again</button>
      </div>
    `;
  }
}

function dueCards() {
  const now = Date.now();

  return kanjiData.filter(kanji => {
    const s = cardState(kanji.character);
    return s.seen && s.due <= now;
  });
}

function newCards() {
  const remaining = Math.max(
    0,
    state.dailyNew - getDailyNewCount()
  );

  return kanjiData
    .filter(kanji => !cardState(kanji.character).seen)
    .slice(0, remaining);
}

function makeQueue() {
  const due = dueCards();
  const fresh = newCards();

  sessionQueue = [...due, ...fresh];
  sessionCount = 0;
}

function startCard() {
  currentCard = sessionQueue.shift() || null;
  revealed = false;
  render();
}

function rateCard(rating) {
  if (!currentCard) return;

  const character = currentCard.character;
  const s = cardState(character);
  const isNew = !s.seen;
  const now = Date.now();

  if (rating === "again") {
    s.interval = 0;
    s.due = now + 10 * 60 * 1000;

    // Repeat this card later in the current session.
    sessionQueue.push(currentCard);

  } else if (rating === "hard") {
    s.interval = s.seen
      ? Math.max(1, Math.ceil(s.interval * 1.2))
      : 1;

    s.due = now + s.interval * 86400000;
    s.reps += 1;
    s.seen = true;

  } else {
    s.interval = s.seen
      ? Math.max(4, Math.ceil(s.interval * 2.2))
      : 4;

    s.due = now + s.interval * 86400000;
    s.reps += 1;
    s.seen = true;
  }

  
if (rating !== "again" && isNew) {
  if (!state.dailyNewCountByDeck) {
    state.dailyNewCountByDeck = {};
  }

  const deck = state.activeDeck;

  if (
    !state.dailyNewCountByDeck[deck] ||
    state.dailyNewCountByDeck[deck].date !== todayKey()
  ) {
    state.dailyNewCountByDeck[deck] = {
      date: todayKey(),
      count: 0
    };
  }

  state.dailyNewCountByDeck[deck].count++;
}
  state.cards[`${state.activeDeck}_${character}`] = s;
  state.history.push({
  id: character,
  deck: state.activeDeck,
  rating,
  date: now
});

  saveState();
  sessionCount++;
  startCard();
}

function render() {
  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  if (!dataReady) return;

  if (page === "study") showStudy();
  if (page === "library") showLibrary();
  if (page === "progress") showProgress();
  if (page === "settings") showSettings();
}

function showStudy() {
  const due = dueCards().length;
  const fresh = newCards().length;

  const app = document.getElementById("app");

  if (!currentCard && !sessionQueue.length) {
    makeQueue();
    currentCard = sessionQueue.shift() || null;
  }

  app.innerHTML = `
    <h1>Today's training</h1>
    <p class="subtitle">Your ${state.activeDeck} training ground. One kanji at a time.</p>

    <div class="setting" style="margin:15px 0 20px">
      <div>
        <strong>Choose your JLPT level</strong>
        <div class="note">Switch between your kanji decks</div>
      </div>
      <select id="studyDeck">
        <option value="N5" ${state.activeDeck === "N5" ? "selected" : ""}>N5</option>
        <option value="N4" ${state.activeDeck === "N4" ? "selected" : ""}>N4</option>
        <option value="N3" ${state.activeDeck === "N3" ? "selected" : ""}>N3</option>
        <option value="N2" ${state.activeDeck === "N2" ? "selected" : ""}>N2</option>
        <option value="N1" ${state.activeDeck === "N1" ? "selected" : ""}>N1</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat">
        <strong>${due}</strong>
        <span>Reviews due</span>
      </div>
      <div class="stat">
        <strong>${fresh}</strong>
        <span>New kanji</span>
      </div>
      <div class="stat">
        <strong>${sessionCount}</strong>
        <span>Reviewed today</span>
      </div>
    </div>

    ${currentCard ? `
      <section class="card">
        <div class="deck-label">JLPT ${state.activeDeck} · Kanji</div>
        <div class="kanji">${escapeHTML(currentCard.character)}</div>
        <div class="prompt">
          What does this kanji mean? What are its readings?
        </div>

        <div class="answer ${revealed ? "" : "hidden"}">
          <h2>${escapeHTML((currentCard.meanings || []).join("; "))}</h2>

          <p>
            <strong>On'yomi:</strong>
            ${escapeHTML((currentCard.onyomi || []).join("・") || "—")}
          </p>

          <p>
            <strong>Kun'yomi:</strong>
            ${escapeHTML((currentCard.kunyomi || []).join("・") || "—")}
          </p>

          <p style="margin-top:15px">
            <strong>Common words</strong>
          </p>

          ${renderCardWords(currentCard)}

        </div>
      </section>

      ${!revealed ? `
        <button class="primary" id="reveal">Reveal answer</button>
      ` : `
        <div class="ratings">
          <button class="again" data-rating="again">Again</button>
          <button class="hard" data-rating="hard">Hard</button>
          <button class="good" data-rating="good">Good</button>
        </div>

        <p class="note" style="text-align:center">
          Again: repeat soon · Hard: 1 day · Good: 4 days initially
        </p>
      `}
    ` : `
      <div class="empty">
        <div style="font-size:48px">🎉</div>
        <h2>Training complete!</h2>
        <p>You've finished all the cards currently due.</p>
        <p class="note">
          Come back when your next reviews are due.
        </p>
      </div>
    `}
  `;

  // Switch decks directly from the Study page.
  document.getElementById("studyDeck")?.addEventListener("change", event => {
    state.activeDeck = event.target.value;
    saveState();

    sessionQueue = [];
    currentCard = null;
    revealed = false;
    sessionCount = 0;

    loadDatabase();
  });

  document.getElementById("reveal")?.addEventListener("click", () => {
    revealed = true;
    render();
  });

  document.querySelectorAll("[data-rating]").forEach(button => {
    button.addEventListener("click", () => rateCard(button.dataset.rating));
  });
}

function renderCardWords(kanji) {
  const words = getWordsForKanji(kanji).slice(0, 6);

  if (!words.length) {
    return `<p class="note">No matching vocabulary entries found yet.</p>`;
  }

  return words.map(item => {
    const examples = (item.examples || []).slice(0, 2);

    return `
      <div style="margin:12px 0;padding-bottom:10px;border-bottom:1px solid #383d50">
        <p style="font-size:20px;margin:5px 0">
          <strong>${escapeHTML(item.word)}</strong>
        </p>
        <p style="margin:4px 0">
          ${escapeHTML(item.reading || "")}
          · ${escapeHTML((item.meanings || []).join("; "))}
        </p>

        ${examples.map(example => `
          <div class="example" style="margin-top:12px">
            <p style="color:#f5f5fa;font-size:15px;line-height:2">
              ${formatFurigana(example.furigana || example.ja || "")}
            </p>
            <p>${escapeHTML(example.en || "")}</p>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");
}

function showLibrary() {
  const app = document.getElementById("app");

  app.innerHTML = `
    <h1>Kanji Library</h1>
    <p class="subtitle">
      Browse all ${kanjiData.length} kanji in your N3 database.
    </p>

    <input
      id="librarySearch"
      type="search"
      placeholder="Search kanji or English meaning..."
      style="width:100%;padding:13px;margin-bottom:16px;background:var(--panel2);color:var(--text);border:1px solid #41465a;border-radius:10px;font:inherit"
    >

    <div class="list" id="libraryResults"></div>
  `;

  const search = document.getElementById("librarySearch");

  function updateResults() {
    const query = search.value.trim().toLowerCase();

    const results = kanjiData.filter(kanji => {
      const character = kanji.character || "";
      const meanings = (kanji.meanings || []).join(" ").toLowerCase();

      return character.includes(query) || meanings.includes(query);
    }).slice(0, 100);

    document.getElementById("libraryResults").innerHTML =
      results.map(kanji => `
        <div class="kanji-row">
          <div class="symbol">${escapeHTML(kanji.character)}</div>
          <div>
            <strong>${escapeHTML((kanji.meanings || []).join("; "))}</strong>
            <small>
              On: ${escapeHTML((kanji.onyomi || []).join("・") || "—")}
              · Kun: ${escapeHTML((kanji.kunyomi || []).join("・") || "—")}
            </small>
          </div>
        </div>
      `).join("") || `<div class="empty">No matching kanji found.</div>`;
  }

  search.addEventListener("input", updateResults);
  updateResults();
}

function showProgress() {
  const learned = kanjiData.filter(
    kanji => cardState(kanji.character).seen
  ).length;

  const total = kanjiData.length;
  const percent = total ? Math.round(learned / total * 100) : 0;

  // Show only the review history for the active deck.
  // Older history without a deck label belongs to N3.
  const deckHistory = state.history.filter(
    h => h.deck === state.activeDeck ||
    (!h.deck && state.activeDeck === "N3")
  );

  const reviews = deckHistory.length;
  const good = deckHistory.filter(h => h.rating === "good").length;
  const hard = deckHistory.filter(h => h.rating === "hard").length;
  const again = deckHistory.filter(h => h.rating === "again").length;

  document.getElementById("app").innerHTML = `
    <h1>Your progress</h1>
    <p class="subtitle">Every review is a step forward.</p>

    <div class="stats">
      <div class="stat">
        <strong>${learned}</strong>
        <span>Learned</span>
      </div>
      <div class="stat">
        <strong>${reviews}</strong>
        <span>Total reviews</span>
      </div>
      <div class="stat">
        <strong>${percent}%</strong>
        <span>${state.activeDeck} completed</span>
      </div>
    </div>

    <p><strong>${state.activeDeck} deck progress</strong></p>
    <div class="progressbar">
      <div style="width:${percent}%"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <strong>${good}</strong>
        <span>Good</span>
      </div>
      <div class="stat">
        <strong>${hard}</strong>
        <span>Hard</span>
      </div>
      <div class="stat">
        <strong>${again}</strong>
        <span>Again</span>
      </div>
    </div>

    <p class="note">
      Your progress is saved in this browser on this device.
      We'll add a proper backup and restore feature later.
    </p>
  `;
}

function showSettings() {
  document.getElementById("app").innerHTML = `
    <h1>Settings</h1>
    <p class="subtitle">Set up your daily training.</p>

    <div class="setting">
      <div>
        <strong>New kanji per day</strong>
        <div class="note">Daily target for each individual deck</div>
      </div>
      <input id="dailyNew" type="number" min="1" max="100"
        value="${state.dailyNew}">
    </div>

    <div class="setting">
      <div>
        <strong>Show furigana</strong>
        <div class="note">Display readings above kanji in examples</div>
      </div>
      <input id="furiganaToggle" type="checkbox"
        ${state.showFurigana ? "checked" : ""}
        style="width:22px;height:22px">
    </div>

    <div class="setting">
      <div>
        <strong>Active deck</strong>
        <div class="note">Choose your JLPT level</div>
      </div>
      <select id="activeDeck">
        <option value="N5" ${state.activeDeck === "N5" ? "selected" : ""}>N5</option>
        <option value="N4" ${state.activeDeck === "N4" ? "selected" : ""}>N4</option>
        <option value="N3" ${state.activeDeck === "N3" ? "selected" : ""}>N3</option>
        <option value="N2" ${state.activeDeck === "N2" ? "selected" : ""}>N2</option>
        <option value="N1" ${state.activeDeck === "N1" ? "selected" : ""}>N1</option>
      </select>
    </div>

    <button class="primary" id="saveSettings">Save settings</button>

    <button class="primary" id="reset"
      style="background:#383d50;color:white;margin-top:10px">
      Reset ${state.activeDeck} progress
    </button>

    <p class="note">
      Each deck has its own learning progress, review history and daily
      new-kanji allowance. Your progress is saved on this device.
    </p>
  `;

  document.getElementById("saveSettings").addEventListener("click", () => {
    const value = Number(document.getElementById("dailyNew").value);
    const furigana = document.getElementById("furiganaToggle").checked;
    const selectedDeck = document.getElementById("activeDeck").value;

    if (value >= 1 && value <= 100) {
      const deckChanged = selectedDeck !== state.activeDeck;

      state.dailyNew = value;
      state.showFurigana = furigana;
      state.activeDeck = selectedDeck;

      saveState();

      if (deckChanged) {
        sessionCount = 0;
        loadDatabase();
      } else {
        makeQueue();
        currentCard = sessionQueue.shift() || null;
        render();
      }
    } else {
      alert("Please enter a number between 1 and 100.");
    }
  });

  document.getElementById("reset").addEventListener("click", () => {
    const deck = state.activeDeck;

    if (confirm(`Reset all your ${deck} study progress? This cannot be undone.`)) {
      // Remove this deck's saved card progress.
      Object.keys(state.cards).forEach(key => {
        if (
          key.startsWith(`${deck}_`) ||
          (deck === "N3" && !key.includes("_"))
        ) {
          delete state.cards[key];
        }
      });

      // Remove this deck's review history.
      state.history = state.history.filter(h =>
        h.deck !== deck && !(deck === "N3" && !h.deck)
      );

      // Reset this deck's daily new-kanji counter.
      if (state.dailyNewCountByDeck) {
        delete state.dailyNewCountByDeck[deck];
      }

      saveState();

      sessionQueue = [];
      currentCard = null;
      sessionCount = 0;

      makeQueue();
      currentCard = sessionQueue.shift() || null;
      render();
    }
  });
}
// Navigation
document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    page = button.dataset.page;

    if (page === "study" && !currentCard && !sessionQueue.length) {
      makeQueue();
      currentCard = sessionQueue.shift() || null;
    }

    render();
  });
});

// Start the app
loadDatabase();
</script>
</body>
</html>
